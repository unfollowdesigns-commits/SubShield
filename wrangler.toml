name = "subshield"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "DOCS"
bucket_name = "subshield-docs"

[vars]
APP_URL = "https://app.subshield.io"
# Verify the current model id and per-million-token rates before deploying.
OPENAI_MODEL = "gpt-5-mini"
OPENAI_INPUT_RATE = "0.25"
OPENAI_OUTPUT_RATE = "2.00"
# Vendors chased per cron run. Each costs ~3 subrequests and the free plan
# allows 50 per invocation, so keep this well under 16.
CHASE_BATCH_SIZE = "12"

# Secrets — set with `wrangler secret put <NAME>`, never in this file:
#   OPENAI_API_KEY
#   SUPABASE_URL
#   SUPABASE_SERVICE_KEY
#   LINK_SECRET          long random string; signs review and upload links
#   RESEND_API_KEY       optional — without it, no mail is sent
#   FROM_ADDRESS         e.g. "SubShield <certs@subshield.io>"

# Inbound email is wired in the Cloudflare dashboard, not here:
#   Email > Email Routing > Catch-all address > Send to a Worker > subshield
# One catch-all for every client keeps the account under the 200-rule limit;
# the local part of the recipient address is the tenant key.

[triggers]
# 08:00 America/New_York. Workers cron is UTC only, so this shifts by an hour
# with daylight saving — acceptable for a ladder whose rungs are day windows.
crons = ["0 13 * * *"]
